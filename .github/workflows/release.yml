name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple

  # The apps only get a sync PR when a release is cut (the release-please PR
  # is merged), not on every push to main. The sync is chained here rather
  # than triggered by the release event, because releases created with the
  # default GITHUB_TOKEN do not fire other workflows.
  sync:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/sync.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
